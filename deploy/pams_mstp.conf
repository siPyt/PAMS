# PAMS MS/TP configuration.
# Edit values here directly, OR use the menu in pams_control.py (option "Save"
# writes this file back). Every value maps to a BACnet MS/TP or polling setting.

[serial]
# Serial device for the RS-485 adapter (stable path survives replug):
#   /dev/ttyUSB0  or  /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG0336CH-if00-port0
iface = /dev/ttyUSB0
# Trunk baud rate - MUST match the Siemens trunk exactly:
#   9600 / 19200 / 38400 / 76800 / 115200
baud = 38400
# THIS Pi node's MS/TP MAC address (0-127, must be unused on the trunk):
our_mac = 45
# Highest master MAC on the trunk (set consistently with other masters):
max_master = 127
max_info_frames = 1
# Per-request timeout in milliseconds:
apdu_timeout_ms = 3000

[target]
# The Siemens freezer controller's BACnet device instance number:
device_instance = 1
# The controller's MS/TP MAC in hex (e.g. 01). Leave blank to bind via Who-Is only:
mac =

[points]
# Object addressed as "type:instance". Types may be names or numbers:
#   analog-input (0), analog-output (1), analog-value (2),
#   binary-input (3), binary-output (4), binary-value (5)
temp = analog-input:1
door = binary-input:1
door_enable = true
# Writable Analog Value the Pi writes the health score to:
score = analog-value:50
write_enable = true
# BACnet write priority (1-16); 8 is common for external overrides:
write_priority = 8

[mqtt]
host = localhost
port = 1883
unit_id = FRZ-BMS-01
poll_seconds = 5

[bacnet]
# Directory holding the bacnet-stack MS/TP tools (bacrp/bacwp/bacwi/bacepics):
bin = ~/bacnet-stack/bin
